<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS Master File — AR Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body class="manager-page">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div><i class="bi bi-shop"></i> <span>AR Manager Panel</span></div>
      </div>
      <ul class="nav flex-column sidebar-nav">
        <li class="nav-group-label">Accounts Receivable</li>
        <li class="nav-item">
          <a class="nav-link active" href="#" data-section="arDashboard"
            ><i class="bi bi-speedometer2"></i> AR Dashboard</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-section="arPayments"
            ><i class="bi bi-cash-coin"></i> Payments</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-section="arMemos"
            ><i class="bi bi-file-earmark-text"></i> Memos</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-section="arCredit"
            ><i class="bi bi-person-exclamation"></i> Credit &amp; Overdue</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-section="arReports"
            ><i class="bi bi-file-earmark-bar-graph"></i> AR Reports</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-section="arAccounts"
            ><i class="bi bi-credit-card-2-front"></i> AR Accounts</a
          >
        </li>
        <li class="nav-group-label">System</li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-section="audit"
            ><i class="bi bi-journal-text"></i> Audit Logs</a
          >
        </li>
      </ul>
    </nav>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="main-content">
      <header class="topbar d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <button
            class="btn btn-sm btn-outline-secondary d-lg-none"
            id="sidebarToggle"
          >
            <i class="bi bi-list"></i>
          </button>
          <h5 class="mb-0" id="pageTitle">AR Dashboard &amp; Cash Flow</h5>
        </div>
        <div class="topbar-user">
          <div class="topbar-user-name">
            <span id="managerName">—</span>
            <span class="topbar-user-role">AR Manager</span>
          </div>
          <button
            class="btn btn-sm btn-outline-secondary"
            id="logoutBtn"
            title="Logout"
          >
            <i class="bi bi-box-arrow-right"></i
            ><span class="d-none d-md-inline ms-1">Logout</span>
          </button>
        </div>
      </header>

      <main class="p-4">
        <!-- ================= AR DASHBOARD / PAYMENTS / CREDIT / REPORTS ================= -->
        <section id="section-arDashboard" class="content-section">
          <div id="arDashboardRoot"></div>
        </section>
        <section id="section-arPayments" class="content-section d-none">
          <div id="arPaymentsRoot"></div>
        </section>
        <section id="section-arMemos" class="content-section d-none">
          <div id="arMemosRoot"></div>
        </section>
        <section id="section-arCredit" class="content-section d-none">
          <div id="arCreditRoot"></div>
        </section>
        <section id="section-arReports" class="content-section d-none">
          <div id="arReportsRoot"></div>
        </section>
        <section id="section-audit" class="content-section d-none">
          <div id="managerAuditRoot"></div>
        </section>

        <!-- ================= AR ACCOUNTS ================= -->
        <section id="section-arAccounts" class="content-section d-none">
          <div
            class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"
          >
            <input
              type="text"
              class="form-control"
              id="arAccountSearch"
              placeholder="Search customer..."
              style="max-width: 300px"
            />
            <select
              class="form-select"
              id="arAccountStatusFilter"
              style="max-width: 200px"
            >
              <option value="pending" selected>Pending</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="rejected">Rejected</option>
              <option value="all">All</option>
            </select>
            <button class="btn btn-primary" id="btnAddArAccount">
              <i class="bi bi-plus-lg"></i> Add AR Account
            </button>
          </div>
          <div class="table-responsive card p-2">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Term</th>
                  <th>Limit</th>
                  <th>Balance</th>
                  <th>Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="arAccountTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div
      class="toast-container position-fixed bottom-0 end-0 p-3"
      id="toastContainer"
      style="z-index: 1200"
    ></div>

    <div class="modal fade" id="viewModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">AR Account Details</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="viewModalBody"></div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
    <script type="module">
      import { checkAuth, logout } from "./modules/auth.js";
      import {
        initManagerAr,
        initActivityPage,
        markActivitySeen,
      } from "./modules/managerAr.js";
      import { displayActivityLog } from "./modules/activityFeed.js";
      import {
        initArDashboard,
        refreshArDashboard,
      } from "./modules/managerArDashboard.js";
      import {
        initArPayments,
        reloadAll as reloadArPayments,
      } from "./modules/managerArPayments.js";
      import {
        initArMemos,
        refreshArMemos,
      } from "./modules/managerArMemos.js";
      import {
        initArCredit,
        refreshArCredit,
      } from "./modules/managerArCredit.js";
      import {
        initArReports,
        refreshArReports,
      } from "./modules/managerArReports.js";
      import {
        initManagerAudit,
        refreshManagerAudit,
      } from "./modules/managerAudit.js";

      const sectionTitles = {
        arDashboard: "AR Dashboard & Cash Flow",
        arPayments: "AR Payments",
        arMemos: "Credit & Debit Memos",
        arCredit: "Customer Credit & Overdue Monitoring",
        arReports: "AR Reports",
        arAccounts: "AR Accounts — AR Manager Review",
        audit: "Audit Logs (AR)",
      };
      // First visit initialises a section; later visits refresh it so figures are never stale.
      const sectionInit = {
        arDashboard: initArDashboard,
        arPayments: initArPayments,
        arMemos: initArMemos,
        arCredit: initArCredit,
        arReports: initArReports,
        audit: initManagerAudit,
      };
      const sectionRefresh = {
        arDashboard: refreshArDashboard,
        arPayments: reloadArPayments,
        arMemos: refreshArMemos,
        arCredit: refreshArCredit,
        arReports: refreshArReports,
        audit: refreshManagerAudit,
      };
      const initializedSections = new Set(["arAccounts"]);
      let currentSection = "arDashboard";

      document.addEventListener("DOMContentLoaded", async () => {
        const session = await checkAuth(["Manager"]);
        if (!session) return;

        document.getElementById("managerName").textContent =
          session.display_name;
        document.getElementById("logoutBtn").addEventListener("click", logout);

        document.querySelectorAll(".sidebar-nav .nav-link").forEach((link) => {
          link.addEventListener("click", (e) => {
            e.preventDefault();
            showSection(link.dataset.section);
            document
              .querySelectorAll(".sidebar-nav .nav-link")
              .forEach((l) => l.classList.remove("active"));
            link.classList.add("active");
            document.getElementById("sidebar").classList.remove("show");
            document
              .getElementById("sidebarBackdrop")
              ?.classList.remove("show");
          });
        });
        document
          .getElementById("sidebarToggle")
          ?.addEventListener("click", () => {
            const open = document
              .getElementById("sidebar")
              .classList.toggle("show");
            document
              .getElementById("sidebarBackdrop")
              ?.classList.toggle("show", open);
          });
        document
          .getElementById("sidebarBackdrop")
          ?.addEventListener("click", () => {
            document.getElementById("sidebar").classList.remove("show");
            document
              .getElementById("sidebarBackdrop")
              .classList.remove("show");
          });

        initManagerAr(session);
        initializedSections.add("arDashboard");
        initArDashboard();
      });

      function showSection(name) {
        currentSection = name;
        document
          .querySelectorAll(".content-section")
          .forEach((s) => s.classList.add("d-none"));
        document.getElementById(`section-${name}`).classList.remove("d-none");
        document.getElementById("pageTitle").textContent = sectionTitles[name];

        if (name === "activity") markActivitySeen();

        if (!initializedSections.has(name)) {
          if (name === "activity") initActivityPage();
          if (sectionInit[name]) sectionInit[name]();
          initializedSections.add(name);
        } else if (name === "activity") {
          displayActivityLog();
        } else if (sectionRefresh[name]) {
          sectionRefresh[name]();
        }
      }
    </script>
  </body>
</html>
