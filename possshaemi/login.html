<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS w/ AR — Sign In</title>
    <style>
      /* Login — Option A (approved 2026-10-21): minimalist, bare on white.
       Single 360px form column inside a 1px hairline border (#e6e8eb, 8px radius), no corner text except the
       POS w/ AR wordmark at the upper left. Palette/type from style.css. */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background: #fff;
        color: #16191d;
        -webkit-font-smoothing: antialiased;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 20px 28px;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: -0.01em;
      }
      .wordmark .sq {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: #1f4e8c;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 20px 48px;
      }
      .login {
        width: 432px;
        max-width: 100%;
        border: 1px solid #e6e8eb;
        border-radius: 8px;
        box-shadow:
          0 1px 2px rgba(16, 24, 40, 0.05),
          0 12px 32px rgba(16, 24, 40, 0.1);
        padding: 36px 36px 30px;
      }
      .login h1 {
        margin: 0 0 6px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .login .sub {
        margin: 0 0 26px;
        font-size: 14px;
        color: #66707a;
      }
      .alert {
        display: none;
        border: 1px solid #f0c2c6;
        background: #fdf3f4;
        color: #842029;
        font-size: 13.5px;
        padding: 10px 12px;
        border-radius: 6px;
        margin-bottom: 18px;
      }
      .alert.show {
        display: block;
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #2b333c;
        margin-bottom: 6px;
      }
      .input-wrap {
        position: relative;
      }
      .input-wrap input {
        width: 100%;
        height: 44px;
        font: inherit;
        font-size: 14.5px;
        padding: 0 64px 0 12px;
        border: 1px solid #cfd6dd;
        border-radius: 6px;
        background: #fff;
        color: #16191d;
        outline: none;
      }
      .input-wrap input.username {
        padding-right: 12px;
      }
      .input-wrap input::placeholder {
        color: #9aa4ad;
      }
      /* Hide Edge's built-in password reveal eye (::-ms-reveal) — the page has
       its own Show/Hide button, so the browser one would be a duplicate. */
      .input-wrap input::-ms-reveal,
      .input-wrap input::-ms-clear {
        display: none;
      }
      .input-wrap input:focus {
        border-color: #1f4e8c;
        box-shadow: 0 0 0 3px rgba(31, 78, 140, 0.14);
      }
      .eye {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: none;
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        color: #1f4e8c;
        cursor: pointer;
        padding: 8px 10px;
      }
      .btn-signin {
        width: 100%;
        height: 44px;
        margin-top: 4px;
        border: 0;
        border-radius: 6px;
        background: #1f4e8c;
        color: #fff;
        font: inherit;
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-signin:hover {
        background: #163a68;
      }
      .btn-signin:disabled {
        opacity: 0.65;
        cursor: default;
      }
      .below {
        margin-top: 16px;
        font-size: 13px;
        color: #66707a;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wordmark"><span class="sq">P</span>POS w/ AR</div>

    <main>
      <form class="login" id="loginForm" novalidate>
        <h1 id="greeting">Good morning</h1>
        <p class="sub">Sign in with your username and password to continue.</p>

        <div class="alert" id="loginError"></div>

        <div class="field">
          <label for="loginUsername">Username</label>
          <div class="input-wrap">
            <input
              type="text"
              class="username"
              id="loginUsername"
              autocomplete="username"
              placeholder="Username"
              autofocus
              required
            />
          </div>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="loginPassword"
              autocomplete="current-password"
              placeholder="Password"
              required
            />
            <button type="button" class="eye" id="togglePasswordBtn">
              Show
            </button>
          </div>
        </div>
        <button type="submit" class="btn-signin" id="loginSubmitBtn">
          Sign in
        </button>
        <div class="below">
          Forgot your password? An administrator can reset it in Employees.
        </div>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script>
      const baseApiUrl = `${window.location.origin}/possshaemi/api`;

      // const baseApiUrl = `${window.location.origin}/possshaemi/api`;
      /* Greeting by local time:
   00:00-11:59 Good morning · 12:00-12:59 Good noon ·
   13:00-17:59 Good afternoon · 18:00-23:59 Good evening */
      function greetingForHour(h) {
        if (h < 12) return "Good morning";
        if (h < 13) return "Good noon";
        if (h < 18) return "Good afternoon";
        return "Good evening";
      }
      document.getElementById("greeting").textContent = greetingForHour(
        new Date().getHours(),
      );

      document.addEventListener("DOMContentLoaded", () => {
        document
          .getElementById("loginForm")
          .addEventListener("submit", handleLoginSubmit);

        const toggleBtn = document.getElementById("togglePasswordBtn");
        toggleBtn.addEventListener("click", () => {
          const passwordInput = document.getElementById("loginPassword");
          const show = passwordInput.type === "password";
          passwordInput.type = show ? "text" : "password";
          toggleBtn.textContent = show ? "Hide" : "Show";
          passwordInput.focus();
        });
      });

      /* The role is never selected on this page. The server returns the account's
   role after a successful login, and it decides where the user lands. */
      function redirectByRole(role) {
        if (role === "Administrator") {
          window.location.href = "index.html";
        } else if (role === "Manager") {
          window.location.href = "manager.html";
        } else if (role === "Cashier") {
          window.location.href = "cashier.html";
        }
      }

      async function handleLoginSubmit(e) {
        e.preventDefault();

        const errorBox = document.getElementById("loginError");
        const submitBtn = document.getElementById("loginSubmitBtn");
        errorBox.classList.remove("show");

        const username = document.getElementById("loginUsername").value.trim();
        const password = document.getElementById("loginPassword").value;

        if (username === "" || password === "") {
          errorBox.textContent = "Username and password are required.";
          errorBox.classList.add("show");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in...";

        const formData = new FormData();
        formData.append("operation", "login");
        formData.append("json", JSON.stringify({ username, password }));

        try {
          const response = await axios({
            url: `${baseApiUrl}/auth.php`,
            method: "POST",
            data: formData,
            withCredentials: true,
          });

          if (response.data.success) {
            redirectByRole(response.data.role);
          } else {
            errorBox.textContent = response.data.message;
            errorBox.classList.add("show");
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign in";
          }
        } catch (error) {
          if (error.response) {
            errorBox.textContent = `Server error (${error.response.status}): ${error.response.data?.message ?? "Unknown error."}`;
          } else {
            errorBox.textContent =
              "Unable to reach the server. Check that api/auth.php exists.";
          }
          errorBox.classList.add("show");
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign in";
        }
      }
    </script>
  </body>
</html>
